components:
  schemas:
    BacktestRequestBody:
      properties:
        as_of:
          format: date-time
          title: As Of
          type: string
        cost_assumptions:
          additionalProperties: true
          title: Cost Assumptions
          type: object
        dataset_snapshot_ids:
          items:
            type: string
          minItems: 1
          title: Dataset Snapshot Ids
          type: array
        formula_version:
          minLength: 1
          title: Formula Version
          type: string
        git_sha:
          minLength: 1
          title: Git Sha
          type: string
        model_run_id:
          minLength: 1
          title: Model Run Id
          type: string
        pipeline_inputs:
          additionalProperties: true
          title: Pipeline Inputs
          type: object
        strategy_id:
          minLength: 1
          title: Strategy Id
          type: string
        validation_protocol:
          minLength: 1
          title: Validation Protocol
          type: string
      required:
      - strategy_id
      - dataset_snapshot_ids
      - validation_protocol
      - cost_assumptions
      - formula_version
      - model_run_id
      - git_sha
      - as_of
      title: BacktestRequestBody
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
