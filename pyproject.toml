[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-fund"
version = "0.1.0"
description = "Local-first advisory AI infrastructure fund control room."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.3",
  "uvicorn[standard]==0.37.0",
  "psycopg[binary]==3.2.13",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["packages/core/src", "services/api/src", "services/worker/src"]
include = ["ai_infra_fund_core*", "ai_infra_fund_api*", "ai_infra_fund_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
