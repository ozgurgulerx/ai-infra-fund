services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_infra_fund}
      POSTGRES_USER: ${POSTGRES_USER:-ai_infra_fund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_infra_fund}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ai_infra_fund} -d $${POSTGRES_DB:-ai_infra_fund}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "ai_infra_fund_api.migrate"]
    volumes:
      - ./data:/app/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  test:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: test
    env_file:
      - .env.example
    command: ["python", "-m", "pytest", "tests/test_deployment_readiness.py"]
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AI_INFRA_FUND_INTERNAL_API_BASE_URL: ${AI_INFRA_FUND_INTERNAL_API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
