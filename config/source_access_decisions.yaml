version: 1

optional_public_api_keys:
  - env_var: EIA_API_KEY
    provider: EIA Open Data API
    source_ids: [source_eia_electricity]
    decision: approve_to_activate_when_secret_configured
    notes: Public energy data API. Activate only after the key is configured in cloud secrets.

  - env_var: FRED_API_KEY
    provider: FRED
    source_ids: [source_fred_macro]
    decision: approve_to_activate_when_secret_configured
    notes: Public macro data API. Activate only after the key is configured in cloud secrets.

  - env_var: FINNHUB_API_KEY
    provider: Finnhub
    source_ids: [source_finnhub_company_news]
    decision: approve_to_activate_when_secret_configured
    notes: Public/free-tier company news API. Activate only after the key and usage limits are configured.

source_decisions:
  - source_id: access_eia_open_data_api
    source_name: EIA Open Data API
    url: https://www.eia.gov/opendata/
    source_family: power_grid_energy
    decision: needs_optional_api_key
    crawl_enabled: false
    secret_env_var: EIA_API_KEY
    required_action: Configure EIA_API_KEY in cloud secrets to activate source_eia_electricity.
    notes: The no-key website page is not the canonical runtime feed; use the configured API integration after key approval.

  - source_id: access_fred_api
    source_name: FRED
    url: https://fred.stlouisfed.org/
    source_family: macro_market_data
    decision: needs_optional_api_key
    crawl_enabled: false
    secret_env_var: FRED_API_KEY
    required_action: Configure FRED_API_KEY in cloud secrets to activate source_fred_macro.
    notes: The runtime uses the FRED API source, not broad website crawling.

  - source_id: access_finnhub_company_news
