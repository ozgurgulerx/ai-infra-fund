version: 1

sources:
  - source_id: source_sec_edgar
    source_name: SEC EDGAR
    tier: tier_0_primary
    source_kind: sec_filings
    base_url: https://www.sec.gov
    license_label: public
    data_class: public_evidence
    trust_weight: 0.98
    refresh_interval_minutes: 360
    fanout: ticker
    url_templates:
      - https://www.sec.gov/edgar/search/?q={ticker}

  - source_id: source_nvidia_official
    source_name: NVIDIA Official Feeds
    tier: tier_0_primary
    source_kind: company_investor_relations
    base_url: https://investor.nvidia.com
    license_label: public
    data_class: public_evidence
    trust_weight: 0.96
    refresh_interval_minutes: 360
    fanout: static
    ticker_allowlist: [NVDA]
    url_templates:
      - https://investor.nvidia.com/news-and-events/news/default.aspx

  - source_id: source_tsmc_ir_monthly_revenue
    source_name: TSMC IR Monthly Revenue
    tier: tier_0_primary
    source_kind: earnings_releases
    base_url: https://investor.tsmc.com
    license_label: public
    data_class: public_evidence
    trust_weight: 0.96
    refresh_interval_minutes: 720
    fanout: static
    ticker_allowlist: [TSM]
    url_templates:
      - https://investor.tsmc.com/english/monthly-revenue

  - source_id: source_eia_electricity
    source_name: EIA Electricity Data
    tier: tier_0_primary
    source_kind: utility_load_growth_guidance
    base_url: https://www.eia.gov
    license_label: public
    data_class: public_market_data
    trust_weight: 0.95
    refresh_interval_minutes: 1440
    fanout: series
    series_ids: [ELEC.GEN.ALL-US-99.M, ELEC.SALES.US-ALL.M]
    url_templates:
      - https://api.eia.gov/v2/electricity/retail-sales/data/?facets[seriesId][]={series_id}&frontier_ticker={ticker}

  - source_id: source_fred_macro
    source_name: FRED Macro Series
    tier: tier_0_primary
    source_kind: macro_rates_liquidity_commentary
    base_url: https://api.stlouisfed.org/fred
    license_label: public
    data_class: public_market_data
    trust_weight: 0.99
    refresh_interval_minutes: 1440
    requires_secret: true
    secret_env_var: FRED_API_KEY
    fanout: series
    series_ids: [DFF, DGS10, T10Y2Y, INDPRO]
    url_templates:
      - https://api.stlouisfed.org/fred/series/observations?series_id={series_id}&api_key={api_key}&frontier_ticker={ticker}

  - source_id: source_semianalysis_public
    source_name: SemiAnalysis Public Metadata
    tier: tier_1_specialist
    source_kind: semiconductor_supply_chain_news
    base_url: https://www.semianalysis.com
    license_label: public_metadata_only
    data_class: public_evidence
    trust_weight: 0.90
    refresh_interval_minutes: 720
    metadata_only: true
    fanout: ticker
    url_templates:
      - https://www.semianalysis.com/search?q={ticker}

  - source_id: source_semiconductor_engineering
    source_name: Semiconductor Engineering
    tier: tier_1_specialist
    source_kind: semiconductor_supply_chain_news
