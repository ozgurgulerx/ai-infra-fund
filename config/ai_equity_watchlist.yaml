version: 1

providers:
  - source_id: source_api_sec_edgar
    source_name: SEC EDGAR
    source_type: filings_api
    base_url: https://data.sec.gov
    license_label: public
    data_class: public_evidence
    reliability_score: 0.98
    requires_secret: false
    cik_fanout: true
    cik_lookup_url: https://www.sec.gov/files/company_tickers.json
    url_templates:
      - https://data.sec.gov/submissions/CIK{cik}.json
      - https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json

  - source_id: source_api_yfinance
    source_name: Yahoo Finance (yfinance)
    source_type: market_data_api
    base_url: https://query2.finance.yahoo.com
    license_label: public_personal_use
    data_class: public_market_data
    reliability_score: 0.85
    requires_secret: false
    ticker_fanout: true
    url_templates:
      - https://query2.finance.yahoo.com/v7/finance/quote?symbols={ticker}

  - source_id: source_api_stooq
    source_name: Stooq
    source_type: market_data_api
    base_url: https://stooq.com
    license_label: public
    data_class: public_market_data
    reliability_score: 0.80
    requires_secret: false
    ticker_fanout: true
    url_templates:
      - https://stooq.com/q/d/l/?s={ticker}.us&i=d

  - source_id: source_api_fred
    source_name: FRED (St. Louis Fed)
    source_type: macro_api
    base_url: https://api.stlouisfed.org/fred
    license_label: public
    data_class: public_market_data
    reliability_score: 0.99
    requires_secret: true
    secret_env_var: FRED_API_KEY
    series_fanout:
      - DFF
      - DGS10
      - T10Y2Y
      - INDPRO
      - CPIAUCSL
      - PCEPI
      - PPIACO
      - ELEINDM01USM189S
    url_templates:
      - https://api.stlouisfed.org/fred/series/observations?series_id={series_id}&file_type=json&api_key={api_key}

  - source_id: source_api_gdelt
    source_name: GDELT 2.0 DOC API
    source_type: news_event_api
    base_url: https://api.gdeltproject.org/api/v2/doc/doc
    license_label: public
    data_class: public_evidence
    reliability_score: 0.70
    requires_secret: false
    ticker_fanout: true
    url_templates:
      - https://api.gdeltproject.org/api/v2/doc/doc?query={ticker}&mode=ArtList&format=json&maxrecords=250

  - source_id: source_api_finnhub
    source_name: Finnhub
    source_type: news_event_api
    base_url: https://finnhub.io/api/v1
    license_label: public_free_tier
    data_class: public_evidence
    reliability_score: 0.85
    requires_secret: true
    secret_env_var: FINNHUB_API_KEY
    ticker_fanout: true
    url_templates:
      - https://finnhub.io/api/v1/company-news?symbol={ticker}&token={api_token}

